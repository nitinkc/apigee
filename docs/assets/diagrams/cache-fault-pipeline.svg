<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/>
    </marker>
    <marker id="arr4g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="arr4r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/>
    </marker>
  </defs>

  <!-- ================= TOP: ResponseCache ================= -->
  <text x="24" y="28" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5">RESPONSECACHE — ATTACHED TWICE, LOOKUP IN / POPULATE OUT</text>

  <!-- request path -->
  <rect x="24" y="46" width="86" height="40" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="67" y="70" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">request</text>
  <path d="M112 66 L146 66" stroke="#6366f1" stroke-width="2" marker-end="url(#arr4)"/>

  <polygon points="196,46 236,66 196,86 156,66" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="196" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">key in cache?</text>

  <!-- hit path -->
  <path d="M196 86 L196 124 L300 124" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arr4g)"/>
  <text x="210" y="116" font-size="10.5" font-weight="700" fill="#059669">HIT — skip the backend entirely</text>

  <rect x="304" y="98" width="120" height="52" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <g transform="translate(316,114)" stroke="#047857" stroke-width="2" fill="none">
    <ellipse cx="9" cy="4.5" rx="9" ry="4.5"/>
    <path d="M0 4.5 v12 c0 2.5 4 4.5 9 4.5 s9 -2 9 -4.5 v-12"/>
  </g>
  <text x="352" y="122" font-size="11" font-weight="700" fill="#065f46">serve cached</text>
  <text x="352" y="137" font-size="10" fill="#059669">response from edge</text>

  <!-- miss path -->
  <path d="M236 66 L286 66" stroke="#6366f1" stroke-width="2" marker-end="url(#arr4)"/>
  <text x="261" y="58" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6366f1">MISS</text>

  <rect x="290" y="46" width="80" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="330" y="64" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">backend</text>
  <text x="330" y="79" text-anchor="middle" font-size="9.5" fill="#64748b">round-trip</text>
  <path d="M372 66 L406 66" stroke="#6366f1" stroke-width="2" marker-end="url(#arr4)"/>

  <rect x="410" y="46" width="150" height="40" rx="8" fill="#f0fdfa" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="485" y="63" text-anchor="middle" font-size="11" font-weight="700" fill="#0f766e">RC-Orders (response)</text>
  <text x="485" y="78" text-anchor="middle" font-size="9.5" fill="#0f766e">populate — only if status 200</text>
  <path d="M562 66 L596 66" stroke="#6366f1" stroke-width="2" marker-end="url(#arr4)"/>

  <rect x="600" y="46" width="110" height="40" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="655" y="70" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">response</text>

  <!-- key box -->
  <rect x="560" y="98" width="256" height="52" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="574" y="117" font-size="11" font-weight="700" fill="#9a3412">CacheKey = pathsuffix (+ optional client_id)</text>
  <text x="574" y="133" font-size="10.5" fill="#c2410c">Wrong key → cross-tenant data leak. Design it deliberately.</text>

  <!-- divider -->
  <line x1="24" y1="176" x2="816" y2="176" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ================= BOTTOM: Fault pipeline ================= -->
  <text x="24" y="208" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5">FAULT PIPELINE — EVERY ERROR BECOMES CLEAN JSON</text>

  <!-- policy fails -->
  <rect x="24" y="226" width="150" height="56" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
  <g transform="translate(38,240)" stroke="#e11d48" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="12" cy="12" r="11"/>
    <line x1="12" y1="7" x2="12" y2="13"/>
    <circle cx="12" cy="17" r="1" fill="#e11d48"/>
  </g>
  <text x="72" y="248" font-size="11.5" font-weight="700" fill="#9f1239">policy fails</text>
  <text x="72" y="264" font-size="9.5" fill="#be123c">VerifyAPIKey, Quota,</text>
  <text x="72" y="275" font-size="9.5" fill="#be123c">RaiseFault, any step</text>

  <path d="M176 254 L212 254" stroke="#e11d48" stroke-width="2" marker-end="url(#arr4r)"/>

  <!-- fault rules -->
  <rect x="216" y="216" width="280" height="132" rx="10" fill="#ffffff" stroke="#e11d48" stroke-width="2"/>
  <text x="232" y="238" font-size="12" font-weight="700" fill="#be123c">FaultRules — match on fault.name</text>

  <rect x="230" y="248" width="152" height="34" rx="6" fill="#fff1f2" stroke="#fda4af"/>
  <text x="240" y="263" font-size="10.5" font-weight="600" fill="#9f1239">bad-key</text>
  <text x="240" y="276" font-size="9" fill="#be123c">FailedToResolveAPIKey → 401</text>
  <path d="M384 265 L396 265" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arr4r)"/>
  <rect x="398" y="248" width="86" height="34" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="441" y="269" text-anchor="middle" font-size="9.5" fill="#9f1239">AM-Error401</text>

  <rect x="230" y="290" width="152" height="34" rx="6" fill="#fff1f2" stroke="#fda4af"/>
  <text x="240" y="305" font-size="10.5" font-weight="600" fill="#9f1239">quota</text>
  <text x="240" y="318" font-size="9" fill="#be123c">QuotaViolation · SpikeArrest → 429</text>
  <path d="M384 307 L396 307" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arr4r)"/>
  <rect x="398" y="290" width="86" height="34" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="441" y="311" text-anchor="middle" font-size="9.5" fill="#9f1239">AM-Error429</text>

  <!-- no match -> default -->
  <rect x="216" y="364" width="280" height="44" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="232" y="382" font-size="11" font-weight="700" fill="#475569">no match? → DefaultFaultRule</text>
  <text x="232" y="397" font-size="9.5" fill="#64748b">AM-Error500 — catch-all, never leak internals</text>
  <path d="M356 348 L356 362" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr4r)"/>

  <!-- output -->
  <path d="M498 265 C 540 265 540 290 574 290" stroke="#e11d48" stroke-width="2" fill="none" marker-end="url(#arr4r)"/>
  <path d="M498 307 C 540 307 540 296 574 296" stroke="#e11d48" stroke-width="2" fill="none"/>
  <path d="M498 386 C 560 386 560 300 574 298" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>

  <rect x="578" y="240" width="238" height="96" rx="10" fill="#1e293b"/>
  <text x="594" y="263" font-size="11" font-weight="700" fill="#7dd3fc">client always receives</text>
  <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" fill="#e2e8f0">
    <text x="594" y="284">{"error": {</text>
    <text x="594" y="299">  "code": "UNAUTHORIZED",</text>
    <text x="594" y="314">  "message": "valid apikey req.",</text>
    <text x="594" y="329">  "fault": "FailedToResolve…" }}</text>
  </g>
</svg>
