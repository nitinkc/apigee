<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker>
<marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
</defs>
<rect width="900" height="500" fill="#ffffff" rx="12"/>
<text x="450" y="28" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle" >Anatomy of the lab JWT (HS256) and what VerifyJWT checks</text>
<rect x="40" y="50" width="250" height="44" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
<text x="165.0" y="77" font-size="10.5" font-weight="700" fill="#9f1239" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">eyJhbGciOiJIUzI1NiJ9</text>
<text x="165.0" y="46" font-size="11" font-weight="700" fill="#e11d48" text-anchor="middle" >HEADER</text>
<rect x="300" y="50" width="360" height="44" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="480.0" y="77" font-size="10.5" font-weight="700" fill="#3730a3" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">eyJpc3MiOiJsYWJzLXByb3h5Iiwic3ViIjoi…</text>
<text x="480.0" y="46" font-size="11" font-weight="700" fill="#4f46e5" text-anchor="middle" >PAYLOAD</text>
<rect x="672" y="50" width="188" height="44" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="766.0" y="77" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Xo3q…tZk</text>
<text x="766.0" y="46" font-size="11" font-weight="700" fill="#059669" text-anchor="middle" >SIGNATURE</text>
<text x="290" y="79" font-size="26" font-weight="700" fill="#334155" text-anchor="middle" >.</text>
<text x="662" y="79" font-size="26" font-weight="700" fill="#334155" text-anchor="middle" >.</text>
<text x="450" y="120" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="middle" >base64url-encoded, joined by dots — readable by anyone, so never put secrets in the payload</text>
<rect x="40" y="140" width="250" height="120" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
<text x="54" y="160" font-size="11.5" font-weight="700" fill="#9f1239" text-anchor="start" >Header (decoded)</text>
<text x="54" y="182" font-size="11" font-weight="400" fill="#9f1239" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">{</text>
<text x="54" y="200" font-size="11" font-weight="400" fill="#9f1239" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">  "alg": "HS256",</text>
<text x="54" y="218" font-size="11" font-weight="400" fill="#9f1239" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">  "typ": "JWT"</text>
<text x="54" y="236" font-size="11" font-weight="400" fill="#9f1239" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">}</text>
<rect x="300" y="140" width="360" height="172" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="314" y="160" font-size="11.5" font-weight="700" fill="#3730a3" text-anchor="start" >Claims (decoded) — set by GJ-MintJWT</text>
<text x="314" y="184" font-size="11" font-weight="400" fill="#3730a3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">"iss": "labs-proxy",</text>
<text x="520" y="184" font-size="10" font-weight="400" fill="#64748b" text-anchor="start" >← &lt;Issuer&gt;</text>
<text x="314" y="206" font-size="11" font-weight="400" fill="#3730a3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">"sub": "labs-user",</text>
<text x="520" y="206" font-size="10" font-weight="400" fill="#64748b" text-anchor="start" >← &lt;Subject&gt;</text>
<text x="314" y="228" font-size="11" font-weight="400" fill="#3730a3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">"iat": 1731456789,</text>
<text x="520" y="228" font-size="10" font-weight="400" fill="#64748b" text-anchor="start" >← automatic</text>
<text x="314" y="250" font-size="11" font-weight="400" fill="#3730a3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">"exp": 1731457389</text>
<text x="520" y="250" font-size="10" font-weight="400" fill="#64748b" text-anchor="start" >← &lt;ExpiresIn&gt;10m</text>
<text x="314" y="282" font-size="10" font-weight="500" fill="#4f46e5" text-anchor="start" >Read them in flows: jwt.VJ-CheckJWT.decoded.claim.sub</text>
<rect x="672" y="140" width="188" height="172" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="686" y="160" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="start" >Signature</text>
<text x="686" y="182" font-size="11" font-weight="400" fill="#065f46" text-anchor="start" >HMAC-SHA256(</text>
<text x="686" y="200" font-size="10.5" font-weight="400" fill="#065f46" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">header.payload,</text>
<text x="686" y="218" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">private.jwt.secret</text>
<text x="686" y="236" font-size="11" font-weight="400" fill="#065f46" text-anchor="start" >)</text>
<text x="686" y="262" font-size="10" font-weight="500" fill="#e11d48" text-anchor="start" >Change 1 byte anywhere</text>
<text x="686" y="276" font-size="10" font-weight="500" fill="#e11d48" text-anchor="start" >→ signature mismatch</text>
<rect x="40" y="332" width="820" height="150" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
<path d="M40,344 a12,12 0 0 1 12,-12 h796 a12,12 0 0 1 12,12 v14 h-820 z" fill="#f59e0b"/>
<text x="54" y="351" font-size="13" font-weight="700" fill="#fff" text-anchor="start" >VerifyJWT — checks in order (any failure → fault → FaultRule → 401)</text>
<circle cx="62" cy="378" r="11" fill="#f59e0b"/>
<text x="62" y="382" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" >1</text>
<text x="82" y="382" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="start" >Algorithm</text>
<text x="210" y="382" font-size="11" font-weight="400" fill="#78350f" text-anchor="start" >matches &lt;Algorithm&gt; (blocks "alg":"none" tricks)</text>
<circle cx="62" cy="402" r="11" fill="#f59e0b"/>
<text x="62" y="406" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" >2</text>
<text x="82" y="406" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="start" >Signature</text>
<text x="210" y="406" font-size="11" font-weight="400" fill="#78350f" text-anchor="start" >recompute with the secret; compare</text>
<circle cx="62" cy="426" r="11" fill="#f59e0b"/>
<text x="62" y="430" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" >3</text>
<text x="82" y="430" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="start" >Time claims</text>
<text x="210" y="430" font-size="11" font-weight="400" fill="#78350f" text-anchor="start" >exp not past, nbf/iat sane  → TokenExpired</text>
<circle cx="62" cy="450" r="11" fill="#f59e0b"/>
<text x="62" y="454" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" >4</text>
<text x="82" y="454" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="start" >Iss / Aud / Sub</text>
<text x="210" y="454" font-size="11" font-weight="400" fill="#78350f" text-anchor="start" >only if you configure them in the policy</text>
</svg>