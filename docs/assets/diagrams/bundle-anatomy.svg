<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker>
<marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
</defs>
<rect width="880" height="520" fill="#ffffff" rx="12"/>
<text x="440" y="28" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle" >Anatomy of a proxy bundle  →  one immutable revision</text>
<text x="60" y="84" font-size="13" font-weight="700" fill="#334155" text-anchor="start" >apiproxy/   ← the folder you zip</text>
<rect x="60" y="108" width="300" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="74" y="133" font-size="11" font-weight="700" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">labs-proxy.xml</text>
<path d="M360,128 L430,128" stroke="#94a3b8" stroke-width="2" marker-end="url(#as)" fill="none"/>
<rect x="436" y="108" width="400" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="450" y="133" font-size="11.5" font-weight="500" fill="#334155" text-anchor="start" >descriptor: name + description</text>
<rect x="60" y="160" width="300" height="40" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="74" y="185" font-size="11" font-weight="700" fill="#3730a3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">proxies/default.xml</text>
<path d="M360,180 L430,180" stroke="#94a3b8" stroke-width="2" marker-end="url(#as)" fill="none"/>
<rect x="436" y="160" width="400" height="40" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="450" y="185" font-size="11.5" font-weight="500" fill="#3730a3" text-anchor="start" >ProxyEndpoint — the front door</text>
<rect x="60" y="212" width="300" height="40" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="74" y="237" font-size="11" font-weight="700" fill="#065f46" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">targets/default.xml</text>
<path d="M360,232 L430,232" stroke="#94a3b8" stroke-width="2" marker-end="url(#as)" fill="none"/>
<rect x="436" y="212" width="400" height="40" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="450" y="237" font-size="11.5" font-weight="500" fill="#065f46" text-anchor="start" >TargetEndpoint — the backend</text>
<rect x="60" y="264" width="300" height="40" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="74" y="289" font-size="11" font-weight="700" fill="#92400e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">policies/*.xml</text>
<path d="M360,284 L430,284" stroke="#94a3b8" stroke-width="2" marker-end="url(#as)" fill="none"/>
<rect x="436" y="264" width="400" height="40" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="450" y="289" font-size="11.5" font-weight="500" fill="#92400e" text-anchor="start" >23 single-purpose policy files</text>
<rect x="60" y="316" width="300" height="40" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="74" y="341" font-size="11" font-weight="700" fill="#5b21b6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">resources/jsc/shapeResponse.js</text>
<path d="M360,336 L430,336" stroke="#94a3b8" stroke-width="2" marker-end="url(#as)" fill="none"/>
<rect x="436" y="316" width="400" height="40" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="450" y="341" font-size="11.5" font-weight="500" fill="#5b21b6" text-anchor="start" >code a Javascript policy loads</text>
<text x="60" y="370" font-size="12" font-weight="700" fill="#334155" text-anchor="start" >What each file contains</text>
<rect x="60" y="380" width="776" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="76" y="402" font-size="11" font-weight="400" fill="#334155" text-anchor="start" >ProxyEndpoint: BasePath, VirtualHost, PreFlow / Flows / PostFlow, RouteRules, FaultRules</text>
<text x="76" y="420" font-size="11" font-weight="400" fill="#334155" text-anchor="start" >TargetEndpoint: backend URL (or target server), connection properties, its own flows</text>
<text x="76" y="438" font-size="11" font-weight="400" fill="#334155" text-anchor="start" >Policy:  &lt;Step&gt;&lt;Name&gt;X&lt;/Name&gt;&lt;/Step&gt; in a flow  ⇄  policies/X.xml  (names must match)</text>
<path d="M60,476 H836" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="60" y="478" width="92" height="24" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="106.0" y="494.0" font-size="10.5" font-weight="600" fill="#3730a3" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">zip + import</text>
<path d="M154,490 L200,490" stroke="#6366f1" stroke-width="2" marker-end="url(#ai)" fill="none"/>
<rect x="204" y="478" width="100" height="24" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="254.0" y="494.0" font-size="10.5" font-weight="600" fill="#065f46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">revision N</text>
<path d="M306,490 L352,490" stroke="#059669" stroke-width="2" marker-end="url(#ag)" fill="none"/>
<rect x="356" y="478" width="120" height="24" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
<text x="416.0" y="494.0" font-size="10.5" font-weight="600" fill="#92400e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">deploy to env</text>
<text x="500" y="494" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" >Revisions are never edited — you deploy a new one.</text>
</svg>