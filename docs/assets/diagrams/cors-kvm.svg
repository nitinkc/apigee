<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/>
    </marker>
    <marker id="arr7g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- ============ TOP: CORS preflight ============ -->
  <text x="24" y="26" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5">CORS PREFLIGHT — ANSWERED AT THE EDGE, BACKEND NEVER SEES IT</text>

  <!-- browser -->
  <rect x="24" y="44" width="120" height="64" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <g transform="translate(40,56)" stroke="#4f46e5" stroke-width="2" fill="none" stroke-linecap="round">
    <rect x="0" y="0" width="32" height="26" rx="3"/>
    <line x1="0" y1="8" x2="32" y2="8"/>
    <circle cx="5" cy="4" r="1.4" fill="#4f46e5"/>
  </g>
  <text x="84" y="70" font-size="12" font-weight="600" fill="#1e293b">Browser</text>
  <text x="84" y="86" font-size="10" fill="#64748b">cross-origin SPA</text>

  <!-- OPTIONS arrow -->
  <path d="M146 62 L258 62" stroke="#6366f1" stroke-width="2" marker-end="url(#arr7)"/>
  <text x="202" y="54" text-anchor="middle" font-size="10.5" font-family="ui-monospace, monospace" fill="#4f46e5">OPTIONS /labs/orders</text>

  <!-- edge preflight flow -->
  <rect x="262" y="38" width="240" height="76" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="278" y="60" font-size="12" font-weight="700" fill="#4f46e5">Flow: request.verb = OPTIONS</text>
  <text x="278" y="78" font-size="10.5" fill="#64748b">AM-CORS-Preflight (AssignMessage only)</text>
  <text x="278" y="94" font-size="10.5" fill="#64748b">→ 204 + allow-origin from KVM</text>

  <!-- 204 back -->
  <path d="M258 96 L146 96" stroke="#059669" stroke-width="2" marker-end="url(#arr7g)"/>
  <text x="202" y="90" text-anchor="middle" font-size="10.5" font-family="ui-monospace, monospace" fill="#059669">204 · access-control-allow-*</text>

  <!-- backend crossed out -->
  <rect x="560" y="44" width="130" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="625" y="70" text-anchor="middle" font-size="12" font-weight="600" fill="#94a3b8">backend</text>
  <text x="625" y="88" text-anchor="middle" font-size="10" fill="#94a3b8">not involved</text>
  <path d="M504 76 L556 76" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="540" y1="60" x2="576" y2="96" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>

  <!-- actual request note -->
  <rect x="560" y="120" width="256" height="40" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="574" y="137" font-size="10.5" font-weight="600" fill="#065f46">Actual GET/POST → flows normally,</text>
  <text x="574" y="152" font-size="10.5" fill="#065f46">PostFlow stamps allow-origin on every reply</text>

  <!-- divider -->
  <line x1="24" y1="184" x2="816" y2="184" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ============ BOTTOM: KVM ============ -->
  <text x="24" y="216" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5">KVM — SAME IMMUTABLE BUNDLE, PER-ENVIRONMENT CONFIG</text>

  <!-- proxy bundle -->
  <rect x="24" y="234" width="180" height="86" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="114" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">labs-proxy bundle</text>
  <text x="114" y="276" text-anchor="middle" font-size="10" fill="#64748b">KeyValueMapOperations</text>
  <text x="114" y="292" text-anchor="middle" font-size="10" font-family="ui-monospace, monospace" fill="#4f46e5">kvm.cors.origin</text>
  <text x="114" y="306" text-anchor="middle" font-size="10" font-family="ui-monospace, monospace" fill="#4f46e5">private.jwt.secret · kvm.cache.ttl</text>

  <path d="M206 277 L246 277" stroke="#6366f1" stroke-width="2" marker-end="url(#arr7)"/>
  <text x="226" y="268" text-anchor="middle" font-size="9.5" fill="#64748b">reads</text>

  <!-- kvm map -->
  <rect x="250" y="224" width="240" height="104" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <g transform="translate(266,238)" stroke="#b45309" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="10" cy="4" rx="10" ry="4"/>
    <path d="M0 4 v16 c0 2.2 4.5 4 10 4 s10 -1.8 10 -4 v-16"/>
    <path d="M0 12 c0 2.2 4.5 4 10 4 s10 -1.8 10 -4"/>
    <path d="M30 4 h14 M30 12 h14 M30 20 h10"/>
  </g>
  <text x="316" y="250" font-size="12" font-weight="700" fill="#92400e">KVM: labs-config</text>
  <text x="266" y="276" font-size="10.5" font-family="ui-monospace, monospace" fill="#78350f">cors.origin → https://…</text>
  <text x="266" y="292" font-size="10.5" font-family="ui-monospace, monospace" fill="#78350f">cache.ttl  → 60</text>
  <text x="266" y="308" font-size="10.5" font-family="ui-monospace, monospace" fill="#78350f">jwt.secret → (encrypted)</text>

  <!-- scope chips -->
  <text x="516" y="234" font-size="11" font-weight="600" fill="#64748b">SCOPES — WHO CAN SEE THE ENTRY</text>
  <g font-size="10.5">
    <rect x="516" y="244" width="290" height="22" rx="6" fill="#eef2ff"/>
    <text x="528" y="259" fill="#3730a3" font-weight="600">environment</text>
    <text x="612" y="259" fill="#64748b">per-env origins, TTLs, URLs</text>

    <rect x="516" y="270" width="290" height="22" rx="6" fill="#f5f3ff"/>
    <text x="528" y="285" fill="#6d28d9" font-weight="600">organization</text>
    <text x="612" y="285" fill="#64748b">global constants, feature flags</text>

    <rect x="516" y="296" width="290" height="22" rx="6" fill="#ecfdf5"/>
    <text x="528" y="311" fill="#065f46" font-weight="600">apiproxy / encrypted</text>
    <text x="660" y="311" fill="#64748b">tunables / secrets</text>
  </g>

  <text x="420" y="336" text-anchor="middle" font-size="11.5" fill="#64748b">Change config with apigeecli kvms entries update — no redeploy needed.</text>
</svg>
