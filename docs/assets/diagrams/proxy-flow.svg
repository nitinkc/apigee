<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/>
    </marker>
    <marker id="arr2r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="arr2f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/>
    </marker>
  </defs>

  <!-- client -->
  <rect x="14" y="170" width="92" height="110" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <g transform="translate(38,190)" stroke="#4f46e5" stroke-width="2" fill="none" stroke-linecap="round">
    <rect x="0" y="0" width="44" height="30" rx="4"/>
    <path d="M8 36 h28 M22 30 v6"/>
  </g>
  <text x="60" y="252" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Client</text>
  <text x="60" y="268" text-anchor="middle" font-size="10.5" fill="#64748b">curl / app</text>

  <!-- ProxyEndpoint -->
  <rect x="150" y="46" width="320" height="360" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="150" y="46" width="320" height="42" rx="14" fill="#4f46e5"/>
  <rect x="150" y="74" width="320" height="14" fill="#4f46e5"/>
  <text x="310" y="73" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">ProxyEndpoint — proxies/default.xml</text>
  <text x="310" y="102" text-anchor="middle" font-size="11" fill="#64748b">faces the client · BasePath /labs</text>

  <!-- PreFlow -->
  <rect x="168" y="114" width="284" height="76" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="182" y="133" font-size="12" font-weight="700" fill="#4f46e5">PreFlow</text>
  <text x="252" y="133" font-size="10.5" fill="#64748b">every request, always</text>
  <g font-size="10.5" fill="#1e293b">
    <rect x="180" y="142" width="86" height="22" rx="11" fill="#ffffff" stroke="#6366f1"/>
    <text x="223" y="157" text-anchor="middle">VerifyAPIKey</text>
    <rect x="274" y="142" width="76" height="22" rx="11" fill="#ffffff" stroke="#6366f1"/>
    <text x="312" y="157" text-anchor="middle">Quota</text>
    <rect x="358" y="142" width="80" height="22" rx="11" fill="#ffffff" stroke="#6366f1"/>
    <text x="398" y="157" text-anchor="middle">SpikeArrest</text>
  </g>
  <text x="182" y="181" font-size="10" fill="#64748b">steps run in document order →</text>

  <!-- Conditional Flows -->
  <rect x="168" y="202" width="284" height="96" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="182" y="221" font-size="12" font-weight="700" fill="#7c3aed">Conditional Flows</text>
  <text x="296" y="221" font-size="10.5" fill="#64748b">first match wins</text>
  <g font-size="10.5" fill="#1e293b">
    <rect x="180" y="230" width="128" height="24" rx="6" fill="#ffffff" stroke="#a78bfa"/>
    <text x="244" y="246" text-anchor="middle">GET /orders</text>
    <rect x="316" y="230" width="122" height="24" rx="6" fill="#ffffff" stroke="#a78bfa"/>
    <text x="377" y="246" text-anchor="middle">POST /token</text>
    <rect x="180" y="262" width="128" height="24" rx="6" fill="#ffffff" stroke="#a78bfa"/>
    <text x="244" y="278" text-anchor="middle">OPTIONS (CORS)</text>
    <rect x="316" y="262" width="122" height="24" rx="6" fill="#ffffff" stroke="#a78bfa"/>
    <text x="377" y="278" text-anchor="middle">/secure</text>
  </g>

  <!-- PostFlow -->
  <rect x="168" y="310" width="284" height="44" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="182" y="329" font-size="12" font-weight="700" fill="#4f46e5">PostFlow</text>
  <text x="252" y="329" font-size="10.5" fill="#64748b">final response touches</text>
  <rect x="180" y="334" width="120" height="18" rx="9" fill="#ffffff" stroke="#6366f1"/>
  <text x="240" y="347" text-anchor="middle" font-size="10" fill="#1e293b">AM-CORS-Headers</text>

  <!-- RouteRule -->
  <rect x="168" y="366" width="284" height="28" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="182" y="385" font-size="11" font-weight="700" fill="#c2410c">RouteRule</text>
  <text x="250" y="385" font-size="10.5" fill="#64748b">picks the TargetEndpoint</text>

  <!-- TargetEndpoint -->
  <rect x="560" y="46" width="286" height="240" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <rect x="560" y="46" width="286" height="42" rx="14" fill="#0d9488"/>
  <rect x="560" y="74" width="286" height="14" fill="#0d9488"/>
  <text x="703" y="73" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">TargetEndpoint — targets/default.xml</text>
  <text x="703" y="102" text-anchor="middle" font-size="11" fill="#64748b">faces the backend · URL, TLS, timeouts</text>

  <rect x="578" y="114" width="250" height="60" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="592" y="133" font-size="12" font-weight="700" fill="#0f766e">PreFlow + Flows</text>
  <text x="592" y="150" font-size="10.5" fill="#64748b">target-side policies: auth headers,</text>
  <text x="592" y="164" font-size="10.5" fill="#64748b">JSON→XML, target transforms</text>

  <rect x="578" y="186" width="250" height="44" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="592" y="205" font-size="12" font-weight="700" fill="#0f766e">PostFlow</text>
  <text x="592" y="221" font-size="10.5" fill="#64748b">shape the backend response</text>

  <rect x="578" y="242" width="250" height="28" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="592" y="261" font-size="10.5" fill="#0f766e">HTTPTargetConnection → mocktarget.apigee.net</text>

  <!-- backend -->
  <rect x="560" y="330" width="286" height="76" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <g transform="translate(586,348)" stroke="#475569" stroke-width="2" fill="none">
    <ellipse cx="14" cy="7" rx="14" ry="7"/>
    <path d="M0 7 v20 c0 3.9 6.3 7 14 7 s14 -3.1 14 -7 v-20"/>
  </g>
  <text x="640" y="360" font-size="13" font-weight="600" fill="#1e293b">Backend service</text>
  <text x="640" y="378" font-size="10.5" fill="#64748b">sees Apigee's request, not the client's</text>

  <!-- request arrows -->
  <g stroke="#6366f1" stroke-width="2" fill="none">
    <path d="M108 215 L146 215" marker-end="url(#arr2)"/>
    <text x="127" y="207" text-anchor="middle" font-size="10" fill="#4f46e5">req</text>
    <path d="M472 160 L556 160" marker-end="url(#arr2)"/>
  </g>
  <!-- response arrow -->
  <g stroke="#059669" stroke-width="2" fill="none">
    <path d="M556 240 L472 240" marker-end="url(#arr2r)"/>
    <text x="514" y="230" text-anchor="middle" font-size="10" fill="#059669">response flows run in reverse</text>
    <path d="M146 260 L108 260" marker-end="url(#arr2r)"/>
  </g>

  <!-- fault path -->
  <g>
    <path d="M310 298 L310 414" stroke="#e11d48" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arr2f)"/>
    <rect x="150" y="418" width="560" height="40" rx="10" fill="#fff1f2" stroke="#fda4af"/>
    <g transform="translate(168,430)" stroke="#e11d48" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M8 0 L16 14 H0 Z"/>
      <line x1="8" y1="5" x2="8" y2="9"/>
      <circle cx="8" cy="12" r="0.8" fill="#e11d48"/>
    </g>
    <text x="200" y="437" font-size="12" font-weight="700" fill="#be123c">Fault: any policy fails → short-circuit</text>
    <text x="200" y="452" font-size="11" fill="#64748b">match <tspan font-family="ui-monospace, monospace">fault.name</tspan> in FaultRules → else DefaultFaultRule → clean JSON error to client</text>
  </g>

  <!-- request label -->
  <text x="127" y="290" text-anchor="middle" font-size="10" fill="#059669">res</text>
</svg>
