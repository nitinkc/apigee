<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/>
    </marker>
    <marker id="arr8g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- CI pipeline -->
  <rect x="20" y="40" width="250" height="180" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <rect x="20" y="40" width="250" height="40" rx="14" fill="#475569"/>
  <rect x="20" y="66" width="250" height="14" fill="#475569"/>
  <text x="145" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">CI — build once</text>

  <g>
    <rect x="40" y="96" width="96" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <g transform="translate(52,108)" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 12 l4 4 l8 -10"/>
    </g>
    <text x="80" y="116" font-size="11" font-weight="600" fill="#1e293b">apigeelint</text>
    <text x="80" y="130" font-size="9" fill="#64748b">static checks</text>

    <rect x="146" y="96" width="104" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <g transform="translate(158,106)" stroke="#475569" stroke-width="2" fill="none" stroke-linejoin="round">
      <rect x="0" y="4" width="18" height="18" rx="2"/>
      <path d="M4 4 V0 h10 v4"/>
    </g>
    <text x="188" y="116" font-size="11" font-weight="600" fill="#1e293b">bundle zip</text>
    <text x="188" y="130" font-size="9" fill="#64748b">apiproxy/</text>
  </g>

  <rect x="40" y="156" width="210" height="48" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="145" y="176" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3730a3">import → new revision</text>
  <text x="145" y="193" text-anchor="middle" font-size="10.5" font-family="ui-monospace, monospace" fill="#4f46e5">labs-proxy : rev 7 (immutable)</text>

  <!-- arrows to envs -->
  <path d="M272 130 L304 130" stroke="#6366f1" stroke-width="2" marker-end="url(#arr8)"/>

  <!-- environments -->
  <g>
    <!-- dev -->
    <rect x="308" y="56" width="160" height="148" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
    <rect x="308" y="56" width="160" height="36" rx="12" fill="#0d9488"/>
    <rect x="308" y="80" width="160" height="12" fill="#0d9488"/>
    <text x="388" y="79" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">dev</text>
    <rect x="326" y="104" width="124" height="28" rx="14" fill="#f0fdfa" stroke="#2dd4bf"/>
    <text x="388" y="123" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="#0f766e">rev 7</text>
    <text x="388" y="152" text-anchor="middle" font-size="9.5" fill="#64748b">auto on merge</text>
    <text x="388" y="180" text-anchor="middle" font-size="9.5" fill="#64748b">KVM: dev URLs,</text>
    <text x="388" y="194" text-anchor="middle" font-size="9.5" fill="#64748b">dev target servers</text>

    <!-- gate 1 -->
    <path d="M470 130 L496 130" stroke="#059669" stroke-width="2" marker-end="url(#arr8g)"/>
    <text x="483" y="120" text-anchor="middle" font-size="9.5" fill="#059669">tests pass</text>

    <!-- stage -->
    <rect x="500" y="56" width="160" height="148" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="500" y="56" width="160" height="36" rx="12" fill="#7c3aed"/>
    <rect x="500" y="80" width="160" height="12" fill="#7c3aed"/>
    <text x="580" y="79" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">stage</text>
    <rect x="518" y="104" width="124" height="28" rx="14" fill="#f5f3ff" stroke="#a78bfa"/>
    <text x="580" y="123" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="#6d28d9">rev 7</text>
    <text x="580" y="152" text-anchor="middle" font-size="9.5" fill="#64748b">manual trigger</text>
    <text x="580" y="180" text-anchor="middle" font-size="9.5" fill="#64748b">KVM: stage URLs —</text>
    <text x="580" y="194" text-anchor="middle" font-size="9.5" fill="#64748b">same bundle, diff config</text>

    <!-- gate 2 -->
    <path d="M662 130 L688 130" stroke="#059669" stroke-width="2" marker-end="url(#arr8g)"/>
    <text x="675" y="120" text-anchor="middle" font-size="9.5" fill="#059669">approval</text>

    <!-- prod -->
    <rect x="692" y="56" width="128" height="148" rx="12" fill="#ffffff" stroke="#e11d48" stroke-width="2"/>
    <rect x="692" y="56" width="128" height="36" rx="12" fill="#e11d48"/>
    <rect x="692" y="80" width="128" height="12" fill="#e11d48"/>
    <text x="756" y="79" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">prod</text>
    <rect x="710" y="104" width="92" height="28" rx="14" fill="#fff1f2" stroke="#fda4af"/>
    <text x="756" y="123" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="#be123c">rev 7</text>
    <text x="756" y="152" text-anchor="middle" font-size="9.5" fill="#64748b">manual gate</text>
    <text x="756" y="180" text-anchor="middle" font-size="9.5" fill="#64748b">rollback = deploy</text>
    <text x="756" y="194" text-anchor="middle" font-size="9.5" fill="#64748b">older rev</text>
  </g>

  <!-- footer -->
  <text x="420" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">One revision travels. Never rebuild per environment — per-env differences live in KVMs and target servers.</text>
</svg>
