<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker>
<marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
</defs>
<rect width="900" height="530" fill="#ffffff" rx="12"/>
<text x="450" y="28" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle" >OAuth 2.0 client-credentials: issue once, verify on every call</text>
<rect x="50" y="44" width="120" height="34" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="110" y="66" font-size="11.5" font-weight="700" fill="#3730a3" text-anchor="middle" >Client</text>
<path d="M110,78 V510" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="300" y="44" width="120" height="34" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="360" y="66" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle" >labs-proxy</text>
<path d="M360,78 V510" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="560" y="44" width="120" height="34" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="620" y="66" font-size="11.5" font-weight="700" fill="#5b21b6" text-anchor="middle" >Apigee token store</text>
<path d="M620,78 V510" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="24" y="112" font-size="12" font-weight="700" fill="#4f46e5" text-anchor="start" >A · Get a token</text>
<path d="M110,138 L360,138" stroke="#6366f1" stroke-width="2" marker-end="url(#ai)" fill="none"/>
<text x="235.0" y="130" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle" >POST /labs/token</text>
<text x="235.0" y="154" font-size="9.5" font-weight="400" fill="#64748b" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">grant_type, client_id, client_secret</text>
<circle cx="124" cy="122" r="11" fill="#4f46e5"/>
<text x="124" y="126" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" >1</text>
<rect x="300" y="164" width="120" height="36" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="360" y="180" font-size="10.5" font-weight="700" fill="#3730a3" text-anchor="middle" >OA-IssueToken</text>
<text x="360" y="194" font-size="9.5" font-weight="400" fill="#64748b" text-anchor="middle" >check key+secret</text>
<path d="M360,226 L620,226" stroke="#6366f1" stroke-width="2" marker-end="url(#ai)" fill="none"/>
<text x="490.0" y="218" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle" >resolve app + product</text>
<circle cx="374" cy="210" r="11" fill="#4f46e5"/>
<text x="374" y="214" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" >2</text>
<path d="M620,254 L360,254" stroke="#059669" stroke-width="2" marker-end="url(#ag)" fill="none"/>
<text x="490.0" y="246" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle" >ok → store token (TTL 1h)</text>
<circle cx="606" cy="238" r="11" fill="#4f46e5"/>
<text x="606" y="242" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" >3</text>
<path d="M360,282 L110,282" stroke="#059669" stroke-width="2" marker-end="url(#ag)" fill="none"/>
<text x="235.0" y="274" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle" >200 {access_token, expires_in}</text>
<circle cx="346" cy="266" r="11" fill="#4f46e5"/>
<text x="346" y="270" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" >4</text>
<path d="M20,304 H880" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="24" y="326" font-size="12" font-weight="700" fill="#059669" text-anchor="start" >B · Use it (every request)</text>
<path d="M110,352 L360,352" stroke="#6366f1" stroke-width="2" marker-end="url(#ai)" fill="none"/>
<text x="235.0" y="344" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle" >GET /labs/secure</text>
<text x="235.0" y="368" font-size="9.5" font-weight="400" fill="#64748b" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Authorization: Bearer &lt;token&gt;</text>
<circle cx="124" cy="336" r="11" fill="#4f46e5"/>
<text x="124" y="340" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" >5</text>
<rect x="300" y="376" width="120" height="36" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="360" y="392" font-size="10.5" font-weight="700" fill="#3730a3" text-anchor="middle" >OA-VerifyToken</text>
<text x="360" y="406" font-size="9.5" font-weight="400" fill="#64748b" text-anchor="middle" >VerifyAccessToken</text>
<path d="M360,432 L620,432" stroke="#6366f1" stroke-width="2" marker-end="url(#ai)" fill="none"/>
<text x="490.0" y="424" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle" >lookup token</text>
<circle cx="374" cy="416" r="11" fill="#4f46e5"/>
<text x="374" y="420" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" >6</text>
<path d="M620,456 L360,456" stroke="#059669" stroke-width="2" marker-end="url(#ag)" fill="none"/>
<text x="490.0" y="448" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle" >valid → app, product, scopes</text>
<circle cx="606" cy="440" r="11" fill="#4f46e5"/>
<text x="606" y="444" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" >7</text>
<path d="M360,482 L110,482" stroke="#059669" stroke-width="2" marker-end="url(#ag)" fill="none"/>
<text x="235.0" y="474" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle" >200 {"message":"ok via oauth"}</text>
<circle cx="346" cy="466" r="11" fill="#4f46e5"/>
<text x="346" y="470" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" >8</text>
<text x="450" y="512" font-size="10.5" font-weight="500" fill="#e11d48" text-anchor="middle" >Expired / unknown token → 401 InvalidAccessToken  ·  revoke the token in the store and the very next call fails.</text>
</svg>