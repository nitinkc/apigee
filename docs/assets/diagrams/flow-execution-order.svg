<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker>
<marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
</defs>
<rect width="900" height="470" fill="#ffffff" rx="12"/>
<text x="450" y="28" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle" >Execution order of a single call — 12 attachment points</text>
<rect x="20" y="48" width="860" height="120" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="34" y="68" font-size="12" font-weight="700" fill="#3730a3" text-anchor="start" >REQUEST  (client → backend)  —  RouteRule picks the TargetEndpoint between steps 3 and 4</text>
<rect x="34" y="82" width="130" height="70" rx="8" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/>
<circle cx="48" cy="82" r="11" fill="#4f46e5"/>
<text x="48" y="86" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" >1</text>
<text x="99.0" y="110" font-size="11.5" font-weight="700" fill="#3730a3" text-anchor="middle" >Proxy PreFlow</text>
<text x="99.0" y="126" font-size="9.5" font-weight="400" fill="#64748b" text-anchor="middle" >SA-Global, KVM-Read</text>
<rect x="174" y="82" width="130" height="70" rx="8" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/>
<circle cx="188" cy="82" r="11" fill="#4f46e5"/>
<text x="188" y="86" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" >2</text>
<text x="239.0" y="110" font-size="11.5" font-weight="700" fill="#3730a3" text-anchor="middle" >Proxy Flows</text>
<text x="239.0" y="126" font-size="9.5" font-weight="400" fill="#64748b" text-anchor="middle" >first matching cond.</text>
<rect x="314" y="82" width="130" height="70" rx="8" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/>
<circle cx="328" cy="82" r="11" fill="#4f46e5"/>
<text x="328" y="86" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" >3</text>
<text x="379.0" y="110" font-size="11.5" font-weight="700" fill="#3730a3" text-anchor="middle" >Proxy PostFlow</text>
<text x="379.0" y="126" font-size="9.5" font-weight="400" fill="#64748b" text-anchor="middle" >always runs</text>
<rect x="454" y="82" width="130" height="70" rx="8" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/>
<circle cx="468" cy="82" r="11" fill="#4f46e5"/>
<text x="468" y="86" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" >4</text>
<text x="519.0" y="110" font-size="11.5" font-weight="700" fill="#3730a3" text-anchor="middle" >Target PreFlow</text>
<text x="519.0" y="126" font-size="9.5" font-weight="400" fill="#64748b" text-anchor="middle" >before the backend</text>
<rect x="594" y="82" width="130" height="70" rx="8" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/>
<circle cx="608" cy="82" r="11" fill="#4f46e5"/>
<text x="608" y="86" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" >5</text>
<text x="659.0" y="110" font-size="11.5" font-weight="700" fill="#3730a3" text-anchor="middle" >Target Flows</text>
<text x="659.0" y="126" font-size="9.5" font-weight="400" fill="#64748b" text-anchor="middle" >cond. flows</text>
<rect x="734" y="82" width="130" height="70" rx="8" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/>
<circle cx="748" cy="82" r="11" fill="#4f46e5"/>
<text x="748" y="86" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" >6</text>
<text x="799.0" y="110" font-size="11.5" font-weight="700" fill="#3730a3" text-anchor="middle" >Target PostFlow</text>
<text x="799.0" y="126" font-size="9.5" font-weight="400" fill="#64748b" text-anchor="middle" >last hop out</text>
<rect x="20" y="178" width="860" height="40" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="450" y="203" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle" >⇣  BACKEND  mocktarget.apigee.net  (edge-only routes skip this)  ⇡</text>
<rect x="20" y="228" width="860" height="120" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="34" y="248" font-size="12" font-weight="700" fill="#065f46" text-anchor="start" >RESPONSE  (backend → client) — runs in REVERSE endpoint order</text>
<rect x="34" y="262" width="130" height="70" rx="8" fill="#fff" stroke="#059669" stroke-width="1.5"/>
<circle cx="48" cy="262" r="11" fill="#059669"/>
<text x="48" y="266" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" >7</text>
<text x="99.0" y="290" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle" >Target PreFlow</text>
<text x="99.0" y="306" font-size="9.5" font-weight="400" fill="#64748b" text-anchor="middle" >backend replied</text>
<rect x="174" y="262" width="130" height="70" rx="8" fill="#fff" stroke="#059669" stroke-width="1.5"/>
<circle cx="188" cy="262" r="11" fill="#059669"/>
<text x="188" y="266" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" >8</text>
<text x="239.0" y="290" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle" >Target Flows</text>
<text x="239.0" y="306" font-size="9.5" font-weight="400" fill="#64748b" text-anchor="middle" >cond. flows</text>
<rect x="314" y="262" width="130" height="70" rx="8" fill="#fff" stroke="#059669" stroke-width="1.5"/>
<circle cx="328" cy="262" r="11" fill="#059669"/>
<text x="328" y="266" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" >9</text>
<text x="379.0" y="290" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle" >Target PostFlow</text>
<text x="379.0" y="306" font-size="9.5" font-weight="400" fill="#64748b" text-anchor="middle" >last target step</text>
<rect x="454" y="262" width="130" height="70" rx="8" fill="#fff" stroke="#059669" stroke-width="1.5"/>
<circle cx="468" cy="262" r="11" fill="#059669"/>
<text x="468" y="266" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" >10</text>
<text x="519.0" y="290" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle" >Proxy PreFlow</text>
<text x="519.0" y="306" font-size="9.5" font-weight="400" fill="#64748b" text-anchor="middle" >first proxy step</text>
<rect x="594" y="262" width="130" height="70" rx="8" fill="#fff" stroke="#059669" stroke-width="1.5"/>
<circle cx="608" cy="262" r="11" fill="#059669"/>
<text x="608" y="266" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" >11</text>
<text x="659.0" y="290" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle" >Proxy Flows</text>
<text x="659.0" y="306" font-size="9.5" font-weight="400" fill="#64748b" text-anchor="middle" >JS-ShapeResponse</text>
<rect x="734" y="262" width="130" height="70" rx="8" fill="#fff" stroke="#059669" stroke-width="1.5"/>
<circle cx="748" cy="262" r="11" fill="#059669"/>
<text x="748" y="266" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" >12</text>
<text x="799.0" y="290" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle" >Proxy PostFlow</text>
<text x="799.0" y="306" font-size="9.5" font-weight="400" fill="#64748b" text-anchor="middle" >AM-CORS-Headers</text>
<text x="34" y="372" font-size="12" font-weight="700" fill="#334155" text-anchor="start" >Three rules to remember</text>
<text x="34" y="392" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" >1.  Within a phase, steps run top-to-bottom in document order.</text>
<text x="34" y="412" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" >2.  PreFlow and PostFlow always run; only ONE conditional Flow runs (first match wins).</text>
<text x="34" y="432" font-size="11.5" font-weight="400" fill="#e11d48" text-anchor="600" >3.  A fault anywhere jumps to FaultRules and skips the rest — including the PostFlow.</text>
<text x="34" y="452" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start" >    That is why every error policy in labs-proxy sets its own CORS header.</text>
</svg>