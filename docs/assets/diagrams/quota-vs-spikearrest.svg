<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ============ LEFT: SpikeArrest ============ -->
  <rect x="20" y="16" width="390" height="270" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <g transform="translate(40,30)" stroke="#b45309" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M2 22 a13 13 0 1 1 26 0"/>
    <line x1="15" y1="22" x2="21" y2="10"/>
    <circle cx="15" cy="22" r="2" fill="#b45309"/>
  </g>
  <text x="84" y="48" font-size="15" font-weight="700" fill="#1e293b">SpikeArrest</text>
  <text x="84" y="66" font-size="11" fill="#64748b">"is traffic arriving faster than N/sec?"</text>

  <!-- incoming burst -->
  <text x="40" y="102" font-size="11" font-weight="600" fill="#64748b">REQUESTS ARRIVE</text>
  <g>
    <circle cx="56" cy="126" r="7" fill="#6366f1"/>
    <circle cx="74" cy="126" r="7" fill="#6366f1"/>
    <circle cx="88" cy="126" r="7" fill="#6366f1"/>
    <circle cx="99" cy="126" r="7" fill="#6366f1"/>
    <circle cx="124" cy="126" r="7" fill="#6366f1"/>
    <circle cx="140" cy="126" r="7" fill="#6366f1"/>
    <circle cx="152" cy="126" r="7" fill="#6366f1"/>
    <circle cx="180" cy="126" r="7" fill="#6366f1"/>
  </g>
  <text x="110" y="147" font-size="10" fill="#64748b">bursts — uneven spacing</text>

  <!-- gate -->
  <path d="M216 126 L 246 126" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr3)"/>
  <rect x="250" y="96" width="64" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="282" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">12pm</text>
  <text x="282" y="137" text-anchor="middle" font-size="9.5" fill="#b45309">≈ 1 req / 5s</text>
  <text x="282" y="149" text-anchor="middle" font-size="9.5" fill="#b45309">per MP</text>

  <!-- smoothed output -->
  <path d="M318 126 L 344 126" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr3)"/>
  <circle cx="360" cy="126" r="7" fill="#059669"/>
  <circle cx="388" cy="126" r="7" fill="#059669"/>
  <text x="374" y="147" font-size="10" fill="#64748b" text-anchor="middle">smoothed</text>

  <!-- rejected -->
  <g stroke="#e11d48" stroke-width="2" stroke-linecap="round">
    <line x1="352" y1="176" x2="364" y2="188"/><line x1="364" y1="176" x2="352" y2="188"/>
    <line x1="376" y1="176" x2="388" y2="188"/><line x1="388" y1="176" x2="376" y2="188"/>
  </g>
  <text x="40" y="192" font-size="11" fill="#1e293b">Too close together → <tspan font-weight="700" fill="#e11d48">429 SpikeArrestViolation</tspan></text>

  <!-- protects -->
  <rect x="40" y="214" width="350" height="56" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="54" y="237" font-size="12" font-weight="600" fill="#78350f">Protects the backend</text>
  <text x="54" y="255" font-size="11" fill="#92400e">Rolling window, sub-second smoothing.</text>
  <text x="54" y="268" font-size="11" fill="#92400e">Global — one counter per message processor.</text>

  <!-- ============ RIGHT: Quota ============ -->
  <rect x="430" y="16" width="390" height="270" rx="14" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <g transform="translate(450,30)" stroke="#4f46e5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="8" width="30" height="16" rx="4"/>
    <line x1="36" y1="8" x2="36" y2="24"/>
    <line x1="6" y1="14" x2="24" y2="14"/>
    <line x1="6" y1="19" x2="18" y2="19"/>
  </g>
  <text x="494" y="48" font-size="15" font-weight="700" fill="#1e293b">Quota</text>
  <text x="494" y="66" font-size="11" fill="#64748b">"has this app used up N calls per hour?"</text>

  <!-- per-app buckets -->
  <text x="450" y="102" font-size="11" font-weight="600" fill="#64748b">PER-IDENTIFIER COUNTERS (e.g. client_id)</text>

  <!-- app 1 bucket -->
  <text x="450" y="130" font-size="11" fill="#1e293b">app-1</text>
  <rect x="495" y="118" width="200" height="18" rx="9" fill="#e2e8f0"/>
  <rect x="495" y="118" width="200" height="18" rx="9" fill="#6366f1"/>
  <text x="595" y="132" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">10 / 10 used</text>
  <text x="706" y="132" font-size="10.5" font-weight="700" fill="#e11d48">→ 429</text>

  <!-- app 2 bucket -->
  <text x="450" y="162" font-size="11" fill="#1e293b">app-2</text>
  <rect x="495" y="150" width="200" height="18" rx="9" fill="#e2e8f0"/>
  <rect x="495" y="150" width="140" height="18" rx="9" fill="#818cf8"/>
  <text x="565" y="164" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">7 / 10</text>
  <text x="706" y="164" font-size="10.5" fill="#059669">→ ok</text>

  <text x="450" y="196" font-size="11" fill="#1e293b">Each app has its own bucket — exhaustion is isolated.</text>

  <!-- enforces -->
  <rect x="450" y="214" width="350" height="56" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="464" y="237" font-size="12" font-weight="600" fill="#3730a3">Enforces the business contract</text>
  <text x="464" y="255" font-size="11" fill="#4338ca">Fixed window (min / hour / day / month).</text>
  <text x="464" y="268" font-size="11" fill="#4338ca">Runs AFTER auth — Identifier must exist first.</text>

  <!-- footer -->
  <text x="420" y="316" text-anchor="middle" font-size="12" fill="#64748b">Burst smoother vs. allowance — they answer different questions and are usually both attached.</text>
</svg>
