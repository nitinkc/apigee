<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker>
<marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
</defs>
<rect width="960" height="520" fill="#ffffff" rx="12"/>
<text x="480" y="28" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle" >Which status code? Where to look first</text>
<rect x="380" y="46" width="200" height="40" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="480" y="71" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle" >curl returned…</text>
<path d="M480,86 V104 H109 V122" stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#as)"/>
<rect x="20" y="126" width="178" height="50" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
<text x="109" y="160" font-size="22" font-weight="800" fill="#f59e0b" text-anchor="middle" >404</text>
<rect x="20" y="186" width="178" height="206" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="30" y="208" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="start" >"Unable to identify proxy"</text>
<text x="30" y="232" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" >→ host / env group / basepath</text>
<text x="30" y="280" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="start" >404 body from mocktarget</text>
<text x="30" y="304" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" >→ proxy ok; backend path bad</text>
<path d="M480,86 V104 H297 V122" stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#as)"/>
<rect x="208" y="126" width="178" height="50" rx="10" fill="#fff" stroke="#4f46e5" stroke-width="2"/>
<text x="297" y="160" font-size="22" font-weight="800" fill="#4f46e5" text-anchor="middle" >401</text>
<rect x="208" y="186" width="178" height="206" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="218" y="208" font-size="10.5" font-weight="700" fill="#3730a3" text-anchor="start" >VerifyAPIKey / OAuth / JWT</text>
<text x="218" y="232" font-size="10.5" font-weight="700" fill="#3730a3" text-anchor="start" >fault.name says which</text>
<text x="218" y="256" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" >→ key missing, token expired?</text>
<text x="218" y="280" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" >→ key not in a product for</text>
<text x="218" y="304" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" >   this proxy?</text>
<path d="M480,86 V104 H485 V122" stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#as)"/>
<rect x="396" y="126" width="178" height="50" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
<text x="485" y="160" font-size="22" font-weight="800" fill="#f59e0b" text-anchor="middle" >429</text>
<rect x="396" y="186" width="178" height="206" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="406" y="208" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="start" >SpikeArrestViolation</text>
<text x="406" y="232" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" >→ too fast (smoothed/sec)</text>
<text x="406" y="256" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="start" >QuotaViolation</text>
<text x="406" y="280" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" >→ allowance used up;</text>
<text x="406" y="304" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" >   check the Identifier</text>
<path d="M480,86 V104 H673 V122" stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#as)"/>
<rect x="584" y="126" width="178" height="50" rx="10" fill="#fff" stroke="#e11d48" stroke-width="2"/>
<text x="673" y="160" font-size="22" font-weight="800" fill="#e11d48" text-anchor="middle" >400/500</text>
<rect x="584" y="186" width="178" height="206" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
<text x="594" y="208" font-size="10.5" font-weight="700" fill="#9f1239" text-anchor="start" >RaiseFault (400)</text>
<text x="594" y="232" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" >→ intentional validation</text>
<text x="594" y="256" font-size="10.5" font-weight="700" fill="#9f1239" text-anchor="start" >500 ExecutionFailed</text>
<text x="594" y="280" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" >→ JS error / callout timeout</text>
<text x="594" y="304" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" >→ Debug: read the last step</text>
<path d="M480,86 V104 H861 V122" stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#as)"/>
<rect x="772" y="126" width="178" height="50" rx="10" fill="#fff" stroke="#0284c7" stroke-width="2"/>
<text x="861" y="160" font-size="22" font-weight="800" fill="#0284c7" text-anchor="middle" >502/503</text>
<rect x="772" y="186" width="178" height="206" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
<text x="782" y="208" font-size="10.5" font-weight="700" fill="#075985" text-anchor="start" >backend unreachable / TLS</text>
<text x="782" y="232" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" >→ Target URL, success.codes</text>
<text x="782" y="256" font-size="10.5" font-weight="700" fill="#075985" text-anchor="start" >503 right after deploy</text>
<text x="782" y="280" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" >→ revision not ready yet;</text>
<text x="782" y="304" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" >   retry in a few seconds</text>
<rect x="20" y="410" width="920" height="96" rx="12" fill="#fff" stroke="#059669" stroke-width="2"/>
<path d="M20,422 a12,12 0 0 1 12,-12 h896 a12,12 0 0 1 12,12 v14 h-920 z" fill="#059669"/>
<text x="34" y="429" font-size="13" font-weight="700" fill="#fff" text-anchor="start" >Always the same loop</text>
<circle cx="38" cy="452" r="11" fill="#059669"/>
<text x="38" y="456" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" >1</text>
<text x="56" y="456" font-size="10.5" font-weight="600" fill="#065f46" text-anchor="start" >Reproduce with</text>
<text x="56" y="472" font-size="10.5" font-weight="600" fill="#065f46" text-anchor="start" >curl -i</text>
<circle cx="218" cy="452" r="11" fill="#059669"/>
<text x="218" y="456" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" >2</text>
<text x="236" y="456" font-size="10.5" font-weight="600" fill="#065f46" text-anchor="start" >Open Debug (Trace),</text>
<text x="236" y="472" font-size="10.5" font-weight="600" fill="#065f46" text-anchor="start" >send the call again</text>
<circle cx="398" cy="452" r="11" fill="#059669"/>
<text x="398" y="456" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" >3</text>
<text x="416" y="456" font-size="10.5" font-weight="600" fill="#065f46" text-anchor="start" >Find the LAST step</text>
<text x="416" y="472" font-size="10.5" font-weight="600" fill="#065f46" text-anchor="start" >that executed</text>
<circle cx="578" cy="452" r="11" fill="#059669"/>
<text x="578" y="456" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" >4</text>
<text x="596" y="456" font-size="10.5" font-weight="600" fill="#065f46" text-anchor="start" >Compare its variables</text>
<text x="596" y="472" font-size="10.5" font-weight="600" fill="#065f46" text-anchor="start" >with your &lt;Condition&gt;</text>
<circle cx="758" cy="452" r="11" fill="#059669"/>
<text x="758" y="456" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" >5</text>
<text x="776" y="456" font-size="10.5" font-weight="600" fill="#065f46" text-anchor="start" >Fix, redeploy,</text>
<text x="776" y="472" font-size="10.5" font-weight="600" fill="#065f46" text-anchor="start" >repeat</text>
</svg>