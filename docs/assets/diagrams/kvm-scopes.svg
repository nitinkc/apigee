<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker>
<marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
</defs>
<rect width="900" height="440" fill="#ffffff" rx="12"/>
<text x="450" y="28" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle" >KVM scopes — widest to narrowest, and where secrets go</text>
<rect x="30" y="50" width="560" height="370" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="48" y="74" font-size="12" font-weight="700" fill="#3730a3" text-anchor="start" >organization scope</text>
<text x="48" y="90" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start" >visible to every environment · global constants, feature flags</text>
<rect x="60" y="104" width="500" height="290" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="78" y="128" font-size="12" font-weight="700" fill="#065f46" text-anchor="start" >environment scope  ← labs-config lives here</text>
<text x="78" y="144" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start" >per-env values: cors.origin, cache.ttl, backend hosts</text>
<rect x="90" y="160" width="440" height="210" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="108" y="184" font-size="12" font-weight="700" fill="#92400e" text-anchor="start" >apiproxy scope</text>
<text x="108" y="200" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start" >only this proxy can read it</text>
<rect x="120" y="214" width="380" height="130" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="138" y="238" font-size="12" font-weight="700" fill="#5b21b6" text-anchor="start" >KVM: labs-config</text>
<text x="138" y="262" font-size="10.5" font-weight="700" fill="#5b21b6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cors.origin</text>
<text x="250" y="262" font-size="10.5" font-weight="400" fill="#6b21a8" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">= https://myspa.example.com</text>
<text x="138" y="284" font-size="10.5" font-weight="700" fill="#5b21b6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cache.ttl</text>
<text x="250" y="284" font-size="10.5" font-weight="400" fill="#6b21a8" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">= 60</text>
<text x="138" y="306" font-size="10.5" font-weight="700" fill="#5b21b6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">jwt.secret</text>
<text x="250" y="306" font-size="10.5" font-weight="400" fill="#6b21a8" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">= ••••••••  (encrypt me)</text>
<rect x="620" y="50" width="250" height="150" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
<path d="M620,62 a12,12 0 0 1 12,-12 h226 a12,12 0 0 1 12,12 v14 h-250 z" fill="#7c3aed"/>
<text x="634" y="69" font-size="13" font-weight="700" fill="#fff" text-anchor="start" >How the proxy reads it</text>
<text x="634" y="92" font-size="11" font-weight="700" fill="#5b21b6" text-anchor="start" >KVM-ReadConfig  (PreFlow)</text>
<text x="634" y="112" font-size="10" font-weight="400" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">&lt;Scope&gt;environment&lt;/Scope&gt;</text>
<text x="634" y="130" font-size="9.5" font-weight="400" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">&lt;Get assignTo="kvm.cors.origin"&gt;</text>
<text x="634" y="152" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start" >→ later policies use</text>
<text x="634" y="170" font-size="10.5" font-weight="700" fill="#059669" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">{kvm.cors.origin}</text>
<text x="634" y="188" font-size="10" font-weight="400" fill="#64748b" text-anchor="start" >(flow variable, per request)</text>
<rect x="620" y="216" width="250" height="204" rx="12" fill="#fff" stroke="#e11d48" stroke-width="2"/>
<path d="M620,228 a12,12 0 0 1 12,-12 h226 a12,12 0 0 1 12,12 v14 h-250 z" fill="#e11d48"/>
<text x="634" y="235" font-size="13" font-weight="700" fill="#fff" text-anchor="start" >Rules of thumb</text>
<text x="634" y="256" font-size="10.8" font-weight="600" fill="#9f1239" text-anchor="start" >Secrets → encrypted KVM only</text>
<text x="634" y="277" font-size="10.8" font-weight="400" fill="#64748b" text-anchor="start" >(values masked on read in the UI/API)</text>
<text x="634" y="298" font-size="10.8" font-weight="600" fill="#9f1239" text-anchor="start" >Config that changes per env → KVM,</text>
<text x="634" y="319" font-size="10.8" font-weight="400" fill="#64748b" text-anchor="start" >never baked into the bundle</text>
<text x="634" y="340" font-size="10.8" font-weight="600" fill="#9f1239" text-anchor="start" >Read once in PreFlow; cache with</text>
<text x="634" y="361" font-size="10.8" font-weight="400" fill="#64748b" text-anchor="start" >&lt;ExpiryTimeInSecs&gt;300&lt;/…&gt;</text>
<text x="634" y="382" font-size="10.8" font-weight="600" fill="#9f1239" text-anchor="start" >Narrowest scope that works wins</text>
</svg>