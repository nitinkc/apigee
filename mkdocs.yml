site_name: Apigee Hands-On Labs
site_description: A deploy-and-curl field guide to Apigee API management — security, traffic management, mediation, caching, and CI/CD
docs_dir: docs

repo_url: https://github.com/nitinkc/apigee
repo_name: nitinkc/apigee
site_url: https://nitinkc.github.io/apigee/

theme:
  name: material
  features:
    # Navigation
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top # Back-to-top button
    - navigation.footer # Prev/Next page links
    # navigation.instant disabled — breaks live reload (re-enable for production builds)
    # - navigation.instant
    # - navigation.instant.progress
    # Search
    - search.suggest
    - search.highlight
    - search.share
    # Content
    - content.code.copy
    - content.code.annotate # (1) style code annotations
    - content.tabs.link # Sync tabs across page
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search:
      lang: en
  - mkdocs_quiz
  - mermaid2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
      guess_lang: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      title: On this page
  - abbr
  - attr_list
  - md_in_html
  - pymdownx.snippets:
      base_path: docs
  - tables

nav:
  - Home:
      - index: index.md
      - Getting Started: getting-started.md
      - Core Concepts: concepts.md
      - Proxy Anatomy: proxy-anatomy.md
      - Bundle Walkthrough: walkthrough.md
  - Labs:
      - 1. First Proxy: labs/first-proxy.md
      - 2. API Keys: labs/api-keys.md
      - 3. OAuth & JWT: labs/oauth-jwt.md
      - 4. Traffic Management: labs/traffic-management.md
      - 5. Mediation: labs/mediation.md
      - 6. Caching & Faults: labs/caching-faults.md
      - 7. CORS & KVM: labs/cors-kvm.md
  - Policy Cookbook: policy-cookbook.md
  - Deploy & CI/CD: deploy-cicd.md
  - Deep Dives:
      - OAuth Grants & Scopes: deep-dives/oauth-grants.md
      - Cache Policies: deep-dives/cache-policies.md
      - Access Control & Routing: deep-dives/access-routing.md
      - OpenAPI-First: deep-dives/openapi-first.md
      - Testing: deep-dives/testing.md
      - Platform & Operations: deep-dives/platform-ops.md
      - OWASP API Top 10: deep-dives/owasp.md
  - Reference:
      - Debugging: debugging.md
      - Advanced Topics: advanced.md
      - Cheat Sheet: cheatsheet.md
      - Glossary: glossary.md

extra:
  generator: false
